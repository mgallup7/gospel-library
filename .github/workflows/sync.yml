name: Library sync

on:
  schedule:
    - cron: "17 10 * * *"   # 4:17 am in Denver during daylight time, 3:17 in winter
  workflow_dispatch:
    inputs:
      collections:
        description: "Only these collections (comma-separated slugs); blank for all"
        required: false
        default: ""
      full:
        description: "Re-fetch every page, not just what is missing"
        type: boolean
        default: false
      jsp_minutes:
        description: "Minutes to spend on the Joseph Smith Papers this run (default 75; 0 to skip)"
        required: false
        default: ""
      embed_minutes:
        description: "Minutes to spend embedding paragraphs for search by meaning (default 45)"
        required: false
        default: ""

concurrency:
  group: library-sync
  cancel-in-progress: false

# Nothing by default; the one job asks for what it uses.
permissions: {}

# The passphrase and the token are not here: they are given only to the steps that use them,
# so no action from outside this repository runs with either in its environment.
env:
  GOSPEL_LIBRARY_DATA: ${{ github.workspace }}/data

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: write   # the encrypted state, kept on the "state" release
      pages: write      # publishing the app
      id-token: write   # Pages asks for it to prove where the deployment came from
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -q -r requirements.txt

      # The app's own tests, before anything is fetched or published: a failure here stops the run,
      # so a broken shell never reaches the devices.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Test
        run: |
          pip install -q "pytest>=8" onnx
          node --test tests/js/*.test.mjs
          python3 -m pytest -q tests/test_library.py

      - name: Check the passphrase is set
        env:
          LIBRARY_PASSPHRASE: ${{ secrets.LIBRARY_PASSPHRASE }}
        run: |
          if [ -z "$LIBRARY_PASSPHRASE" ]; then
            echo "::error::Add a repository secret named LIBRARY_PASSPHRASE (Settings, Secrets and variables, Actions). It is the key that locks the library."
            exit 1
          fi

      # The owner's private skills are not an input to this workflow, and never were meant to be
      # read here: he seals them on his own machine and uploads skills.bin to the state release
      # (see the README). This step brings that file back as it is; the build copies it out.
      - name: Restore previous state
        env:
          LIBRARY_PASSPHRASE: ${{ secrets.LIBRARY_PASSPHRASE }}
          GH_TOKEN: ${{ github.token }}
        run: bin/ci-restore.sh

      - name: Original languages (loaded once, kept with the state)
        continue-on-error: true
        run: python -m gospel_library originals

      - name: Sync with churchofjesuschrist.org
        id: sync
        continue-on-error: true
        timeout-minutes: 300
        env:
          COLLECTIONS: ${{ inputs.collections }}
          FULL: ${{ inputs.full }}
        run: |
          args=()
          if [ -n "$COLLECTIONS" ]; then args+=(--collections "$COLLECTIONS"); fi
          if [ "$FULL" = "true" ]; then args+=(--full); fi
          python -m gospel_library sync "${args[@]}"

      # A little of the Joseph Smith Papers each night, within a time budget;
      # what is not reached tonight comes on a later night.
      - name: Joseph Smith Papers
        if: github.event_name != 'workflow_dispatch' || inputs.jsp_minutes != '0'
        continue-on-error: true
        timeout-minutes: 110
        env:
          JSP_MINUTES: ${{ inputs.jsp_minutes || 75 }}
        run: python -m gospel_library jsp --minutes "$JSP_MINUTES"

      # The search model (35 MB), kept between runs; the vectors live in the state.
      - name: Search model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: data/model
          key: search-model-bge-small-en-v1.5-v1
      - name: Meaning vectors for new paragraphs
        continue-on-error: true
        timeout-minutes: 70
        env:
          EMBED_MINUTES: ${{ inputs.embed_minutes || 45 }}
        run: python -m gospel_library embed --minutes "$EMBED_MINUTES" --smoke "faith is not to have a perfect knowledge" "what did the prophets say about covenants and identity" "how a missionary can deal with discouragement" "Joseph Smith on the Nauvoo Legion"

      - name: Build the device bundle
        env:
          LIBRARY_PASSPHRASE: ${{ secrets.LIBRARY_PASSPHRASE }}
        run: |
          mkdir -p site
          cp -R web/. site/
          # the search model and its runtime, served beside the app (fetched once by a device, kept offline)
          if [ -f data/model/bge-small-en-v1.5/model_quantized.onnx ]; then
            mkdir -p site/model site/vendor/ort
            cp data/model/bge-small-en-v1.5/model_quantized.onnx data/model/bge-small-en-v1.5/vocab.txt site/model/
            ( cd "$(mktemp -d)" && npm pack onnxruntime-web@1.31.1 >/dev/null 2>&1 && tar xzf onnxruntime-web-*.tgz \
              && cp package/dist/ort.wasm.min.mjs package/dist/ort-wasm-simd-threaded.mjs package/dist/ort-wasm-simd-threaded.wasm "$GITHUB_WORKSPACE/site/vendor/ort/" )
            ls -la site/model site/vendor/ort
          fi
          python -m gospel_library bundle --out site/data | tee bundle.txt
          python -m gospel_library stats | tee stats.txt
          # The numbers, where they can be read without opening the log.
          echo "::notice title=Library built::$(cat bundle.txt)"
          while IFS= read -r line; do echo "::notice title=Collection::$line"; done < <(grep -E "^  [A-Z].* pages " stats.txt | sed 's/^ *//')
          { echo "## Library"; echo; echo '```'; cat bundle.txt stats.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # After the bundle: the bundle step records a snapshot of what it published in the
      # working database, which tomorrow's deltas are computed against.
      - name: Save state for tomorrow
        if: always()
        env:
          LIBRARY_PASSPHRASE: ${{ secrets.LIBRARY_PASSPHRASE }}
          GH_TOKEN: ${{ github.token }}
        run: bin/ci-save.sh

      - name: Keep the sync log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sync-log
          path: data/logs/*.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Pages needs a public repository on the free plan
        if: github.event.repository.private
        run: echo "::warning::This repository is private, so GitHub Pages cannot publish the app. Make it public (Settings, Danger Zone, Change visibility) or move to a paid plan; the library is encrypted either way."

      - id: pages
        if: ${{ !github.event.repository.private }}
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        continue-on-error: true

      - name: Pages is not switched on
        if: ${{ !github.event.repository.private && steps.pages.outcome == 'failure' }}
        run: |
          echo "::error title=GitHub Pages is off::The library was built and saved, but it cannot be published until GitHub Pages is switched on. On github.com open this repository, Settings, Pages, and under Build and deployment set Source to GitHub Actions. Then run this workflow again."
          exit 1

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        if: ${{ !github.event.repository.private }}
        with:
          path: site

      # GitHub Pages sometimes answers a deployment with a server error of its
      # own (a 500). Wait and try twice more before calling the run failed.
      - id: deployment
        if: ${{ !github.event.repository.private }}
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        continue-on-error: true

      - name: Pages hiccup, waiting to try again
        if: ${{ !github.event.repository.private && steps.deployment.outcome == 'failure' }}
        run: sleep 120

      - id: deployment2
        if: ${{ !github.event.repository.private && steps.deployment.outcome == 'failure' }}
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        continue-on-error: true

      - name: Pages hiccup again, one more wait
        if: ${{ !github.event.repository.private && steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure' }}
        run: sleep 300

      - id: deployment3
        if: ${{ !github.event.repository.private && steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure' }}
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

      - name: Published
        if: ${{ !github.event.repository.private }}
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url || steps.deployment3.outputs.page_url }}
        run: echo "::notice title=Published::$PAGE_URL"

      - name: Report a failed sync
        if: steps.sync.outcome == 'failure'
        run: |
          echo "::warning::The sync step failed or ran out of time; what it fetched was saved and published, and tomorrow's run continues from there."
