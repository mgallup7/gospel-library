name: Probe a page

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Page(s) to look at, the way the sync would (comma-separated)"
        required: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Look at the page
        run: python -m gospel_library.probe "${{ inputs.url }}"
      - name: Keep the pages for study
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-pages
          path: probe-out/
          if-no-files-found: ignore
          retention-days: 3
