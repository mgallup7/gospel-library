name: Probe a page

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Page to look at, the way the sync would"
        required: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Look at the page
        run: python -m gospel_library.probe "${{ inputs.url }}"
