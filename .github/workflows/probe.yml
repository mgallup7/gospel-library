name: Probe a page

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Page(s) to look at, the way the sync would (comma-separated)"
        required: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Look at the page
        env:
          PROBE_URL: ${{ inputs.url }}
        run: python -m gospel_library.probe "$PROBE_URL"
      - name: Keep the pages for study
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: probe-pages
          path: probe-out/
          if-no-files-found: ignore
          retention-days: 3
      # The same pages in the log, for a reader that can see logs but not artifacts.
      - name: Pages in the log
        if: always()
        run: |
          if [ -d probe-out ]; then tar czf - probe-out | base64 -w 76 | sed 's/^/B64:/'; fi
