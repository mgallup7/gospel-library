<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- What the app may reach, pinned. Its own files; Claude at api.anthropic.com and nowhere else
     (the API key and the passphrase sit in this page's storage, so nothing here may send them
     elsewhere); no script but the app's own files, so a stray onerror or script tag in library
     HTML cannot run. 'wasm-unsafe-eval' and blob workers are for SQLite and the search model;
     inline style attributes are used by the app (never by library HTML, which is cleaned of
     them before it is shown), inline scripts by nothing. A study page shows in
     study-frame.html, sandboxed, under a policy of its own that lets it reach nothing. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' https://api.anthropic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gospel Library</title>
<meta name="description" content="A personal copy of the scriptures, general conference, and manuals, with instant search.">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Library">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#f3f2ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1d2024" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="./app.css">
<!-- The interface's module chain, asked for at once rather than one import at a time -->
<link rel="modulepreload" href="./app.js">
<link rel="modulepreload" href="./lib/cite.js">
<link rel="modulepreload" href="./lib/markdown.js">
<link rel="modulepreload" href="./lib/chunk.js">
<link rel="modulepreload" href="./lib/checks.js">
<link rel="modulepreload" href="./lib/step.js">
<link rel="modulepreload" href="./lib/refs.js">
<link rel="modulepreload" href="./lib/format.js">
</head>
<body>
<!-- The four places, always in reach: a bar along the bottom on a phone, a rail down the left
     on an iPad (app.css). The old ids stay on the three that had a header button. -->
<nav id="tabs" class="tabs" aria-label="Library, Search, Deck, Ask">
  <button id="homeBtn" class="tab" type="button" data-tab="library">
    <span class="tab-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15.5H6.5A2.5 2.5 0 0 0 4 21z"/><path d="M4 18.5A2.5 2.5 0 0 1 6.5 16H20"/><path d="M9 7.5h7M9 11h5"/></svg></span>
    <span class="tab-lb">Library</span>
  </button>
  <button id="searchTab" class="tab" type="button" data-tab="search">
    <span class="tab-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg></span>
    <span class="tab-lb">Search</span>
  </button>
  <button id="deckBtn" class="tab" type="button" data-tab="deck">
    <span class="tab-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="8" width="17" height="12" rx="2.2"/><path d="M6.5 5h11"/><path d="M8 12.5h8M8 15.5h5"/></svg></span>
    <span class="tab-lb">Deck</span>
  </button>
  <button id="askBtn" class="tab" type="button" data-tab="ask">
    <span class="tab-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12.2c0 3.9-3.6 7-8 7-1 0-2-.2-2.9-.5L4.5 20l1.2-3.6C4.6 15.2 4 13.8 4 12.2c0-3.9 3.6-7 8-7s8 3.1 8 7z"/><path d="M12 8.8l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z"/></svg></span>
    <span class="tab-lb">Ask</span>
  </button>
  <span class="tabs-gap"></span>
  <button id="settingsBtn" class="tab tab-gear" type="button" title="Settings">
    <span class="tab-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l1.9-1.5-2-3.4-2.3.9a7.6 7.6 0 0 0-2.6-1.5L14 2.5h-4l-.4 2.5A7.6 7.6 0 0 0 7 6.5l-2.3-.9-2 3.4 1.9 1.5a7.6 7.6 0 0 0 0 3l-1.9 1.5 2 3.4 2.3-.9a7.6 7.6 0 0 0 2.6 1.5l.4 2.5h4l.4-2.5a7.6 7.6 0 0 0 2.6-1.5l2.3.9 2-3.4z"/></svg></span>
    <span class="tab-lb">Settings</span>
  </button>
</nav>

<!-- Where you are, by name; the search box in the Library and in Search; the shelves to search
     and the filters in Search alone -->
<header class="bar">
  <h1 id="placeTitle">Library</h1>
  <span id="barActs" class="bar-acts"></span>
  <form id="searchForm" class="search" role="search">
    <svg class="search-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
    <input id="q" type="search" placeholder="Search, or type a reference like Alma 32:21" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="Search">
    <button type="button" class="clear" aria-label="Clear">&times;</button>
  </form>
  <div class="scope-row">
    <div class="scopes" role="group" aria-label="Where to search">
      <button type="button" data-scope="all" class="on" aria-pressed="true">All</button>
      <button type="button" data-scope="scriptures" aria-pressed="false">Scriptures</button>
      <button type="button" data-scope="conference" aria-pressed="false">Conference</button>
      <button type="button" data-scope="pmg" aria-pressed="false">PMG</button>
      <button type="button" data-scope="standards" aria-pressed="false">Standards</button>
      <button type="button" data-scope="handbook" aria-pressed="false">Handbook</button>
      <button type="button" data-scope="cfm" aria-pressed="false">Come, Follow Me</button>
      <button type="button" data-scope="manuals" aria-pressed="false">Manuals</button>
      <button type="button" data-scope="helps" aria-pressed="false">Study helps</button>
      <button type="button" data-scope="jsp" aria-pressed="false">JS Papers</button>
    </div>
    <button id="filterBtn" class="filter-btn" type="button" aria-expanded="false" aria-controls="filters"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M7 12h10M10 17h4"/></svg><span>Filters</span></button>
  </div>
</header>

<div id="filters" class="filters" hidden>
  <label>Speaker
    <input id="fSpeaker" list="speakerList" placeholder="Any speaker">
    <datalist id="speakerList"></datalist>
  </label>
  <label>Conference years
    <span class="row"><input id="fFrom" inputmode="numeric" placeholder="From" maxlength="4"><input id="fTo" inputmode="numeric" placeholder="To" maxlength="4"></span>
  </label>
  <label>Scripture book
    <input id="fBook" placeholder="e.g. Alma, D&amp;C, Isaiah">
  </label>
  <label>Show results as
    <span class="seg" id="fGroup"><button type="button" data-group="passages" class="on">Passages</button><button type="button" data-group="documents">Talks and chapters</button></span>
  </label>
  <div class="actions"><button id="fClear" class="text-btn" type="button">Clear filters</button></div>
</div>

<main>
  <section id="list" class="pane"></section>
  <section id="reader" class="pane" hidden></section>
</main>

<div id="stage" class="stage" hidden role="dialog" aria-label="Presentation">
  <div class="stage-body">
    <div class="stage-text"></div>
  </div>
  <div class="stage-foot">
    <div class="stage-ref"></div>
    <div class="stage-count"></div>
  </div>
  <div class="stage-controls">
    <button class="stage-timer" aria-label="Time since Present began, tap to reset" title="Elapsed (tap to reset)">0:00</button>
    <button class="stage-close" aria-label="Stop presenting" title="Stop (Esc)">&times;</button>
    <button class="stage-theme" aria-label="Light or dark" title="Light or dark">&#9680;</button>
    <button class="stage-smaller" aria-label="Smaller" title="Smaller (-)">A</button>
    <button class="stage-larger" aria-label="Larger" title="Larger (+)"><b>A</b></button>
    <button class="stage-prev" aria-label="Previous" title="Previous (left arrow)">&#8249;</button>
    <button class="stage-next" aria-label="Next" title="Next (right arrow or space)">&#8250;</button>
    <div class="stage-upnext"></div>
  </div>
</div>

<div id="sheet" class="sheet" hidden role="dialog" aria-label="Footnote">
  <div class="handle"></div>
  <button class="close" aria-label="Close">&times;</button>
  <div class="sheet-body"></div>
</div>

<!-- Modules, so each can import from lib/. They run deferred, in this order: the error log
     first, so it hears whatever the others throw; then app.js, which sets window.GL, and the
     others read it when they load. -->
<script type="module" src="./lib/log.js"></script>
<script type="module" src="./app.js"></script>
<script type="module" src="./ask.js"></script>
<script type="module" src="./original.js"></script>
<script type="module" src="./deck.js"></script>
<script type="module" src="./studies.js"></script>
<script type="module" src="./marks.js"></script>
</body>
</html>
